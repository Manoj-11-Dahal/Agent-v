<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f2e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#A855F7;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Animated particles -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
        25% { transform: translateY(-20px) translateX(10px); opacity: 1; }
        50% { transform: translateY(-10px) translateX(-5px); opacity: 0.8; }
        75% { transform: translateY(-30px) translateX(15px); opacity: 0.9; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 2; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Glowing orbs -->
  <circle cx="150" cy="100" r="80" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="300" r="100" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="50" r="60" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Floating particles -->
  <g filter="url(#glow)">
    <circle cx="200" cy="150" r="3" fill="#00D4FF">
      <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="200;210;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="250" r="2" fill="#FF6B6B">
      <animate attributeName="cy" values="250;230;250" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="400;415;400" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="180" r="2.5" fill="#A855F7">
      <animate attributeName="cy" values="180;160;180" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;790;800" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="100" r="2" fill="#4ECDC4">
      <animate attributeName="cy" values="100;80;100" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1000;1010;1000" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="320" r="3" fill="#FFD700">
      <animate attributeName="cy" values="320;300;320" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;290;300" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="350" r="2" fill="#00D4FF">
      <animate attributeName="cy" values="350;330;350" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="700;710;700" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Connecting lines between particles (neural network effect) -->
  <g stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.15" stroke-dasharray="5,5">
    <line x1="200" y1="150" x2="400" y2="250">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="250" x2="600" y2="50">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="50" x2="800" y2="180">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="180" x2="1000" y2="100">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="320" x2="400" y2="250">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="350" x2="800" y2="180">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Main Title -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <!-- "Agent-v" text with gradient -->
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="72" font-weight="800" fill="url(#textGradient)" 
          filter="url(#textGlow)" letter-spacing="4">
      Agent-v
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="50" font-family="'Inter', 'SF Pro Display', sans-serif" 
          font-size="20" font-weight="400" fill="#8892B0" 
          letter-spacing="8" text-transform="uppercase">
      AI SKILLS ECOSYSTEM
    </text>
    
    <!-- Animated stats bar -->
    <g transform="translate(-200, 90)">
      <rect x="0" y="0" width="400" height="3" rx="1.5" fill="#1a1a3e"/>
      <rect x="0" y="0" width="400" height="3" rx="1.5" fill="url(#accentGradient)">
        <animate attributeName="width" values="0;400;0" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Tagline -->
    <text x="0" y="120" font-family="'Inter', 'SF Pro Display', sans-serif" 
          font-size="16" font-weight="300" fill="#5E6D8A" 
          letter-spacing="1">
      1,200+ Production-Ready Skills • 40+ Categories • Autonomous Agents
    </text>
    
    <!-- Badge pills -->
    <g transform="translate(-180, 150)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#1a1a3e" stroke="#00D4FF" stroke-width="1" opacity="0.8">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </rect>
        <text x="55" y="19" font-family="'JetBrains Mono', monospace" 
              font-size="11" font-weight="600" fill="#00D4FF" text-anchor="middle">
          1200+ Skills
        </text>
      </g>
      
      <!-- Badge 2 -->
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="90" height="28" rx="14" fill="#1a1a3e" stroke="#A855F7" stroke-width="1" opacity="0.8">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        </rect>
        <text x="45" y="19" font-family="'JetBrains Mono', monospace" 
              font-size="11" font-weight="600" fill="#A855F7" text-anchor="middle">
          40+ Cats
        </text>
      </g>
      
      <!-- Badge 3 -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="100" height="28" rx="14" fill="#1a1a3e" stroke="#FF6B6B" stroke-width="1" opacity="0.8">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
        </rect>
        <text x="50" y="19" font-family="'JetBrains Mono', monospace" 
              font-size="11" font-weight="600" fill="#FF6B6B" text-anchor="middle">
          MIT License
        </text>
      </g>
    </g>
  </g>
  
  <!-- Version badge -->
  <g transform="translate(1050, 350)" text-anchor="end">
    <rect x="-80" y="-18" width="85" height="26" rx="13" fill="url(#accentGradient)" opacity="0.9"/>
    <text x="-38" y="4" font-family="'JetBrains Mono', monospace" 
          font-size="12" font-weight="700" fill="#0a0a1a" text-anchor="middle">
      v2.0.0
    </text>
  </g>
  
  <!-- Corner decorative elements -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.4">
    <!-- Top-left corner -->
    <path d="M 50 50 L 50 100 M 50 50 L 100 50">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Top-right corner -->
    <path d="M 1150 50 L 1100 50 M 1150 50 L 1150 100">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <!-- Bottom-left corner -->
    <path d="M 50 350 L 50 300 M 50 350 L 100 350">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <!-- Bottom-right corner -->
    <path d="M 1150 350 L 1100 350 M 1150 350 L 1150 300">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>
  
  <!-- Animated skill icons floating at bottom -->
  <g transform="translate(0, 320)" opacity="0.6">
    <g transform="translate(100, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#00D4FF" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">⚛</text>
    </g>
    <g transform="translate(220, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#A855F7" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">🤖</text>
    </g>
    <g transform="translate(340, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#FF6B6B" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">🔒</text>
    </g>
    <g transform="translate(460, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#4ECDC4" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">☁️</text>
    </g>
    <g transform="translate(580, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#FFD700" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">🎬</text>
    </g>
    <g transform="translate(700, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#00D4FF" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">🕶️</text>
    </g>
    <g transform="translate(820, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#A855F7" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">🧠</text>
    </g>
    <g transform="translate(940, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#FF6B6B" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">📊</text>
    </g>
    <g transform="translate(1060, 0)">
      <circle cx="0" cy="0" r="20" fill="#1a1a3e" stroke="#4ECDC4" stroke-width="1.5">
        <animate attributeName="cy" values="0;-10;0" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-size="16">⚡</text>
    </g>
  </g>
  
  <!-- Shimmer line across top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accentGradient)">
    <animate attributeName="x" values="-1200;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="398" width="1200" height="2" fill="url(#accentGradient)">
    <animate attributeName="x" values="1200;-1200" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>